# 태그를 밀면 맥에서 빌드해 릴리스에 붙인다. 사람 손이 닿는 곳은 태그 하나뿐이다.
#
#   npm version patch && git push --follow-tags
#
# 앱은 여기 붙는 *-mac.zip 을 보고 스스로 갈아 끼운다 (mac/Sources/update.swift).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      # 아래 비밀값을 리포 Settings → Secrets 에 넣으면 정식 서명 + 공증까지 간다.
      # 없으면 임시 서명으로만 나간다 — 받는 사람 화면에 Gatekeeper 경고가 뜬다.
      DDONG_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전이 태그와 같은지 본다
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" mac/Info.plist)
          echo "태그 $tag · Info.plist $plist"
          # 이게 어긋나면 앱이 자기가 최신인 줄 알고 업데이트를 영영 안 받는다.
          [ "$tag" = "$plist" ] || { echo "::error::태그와 Info.plist 버전이 다르다"; exit 1; }

      - name: 서명 열쇠 넣기
        if: env.DDONG_SIGN_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # 러너에만 있다가 사라지는 임시 키체인. 비밀번호는 이 실행에서만 쓴다.
          keychain="$RUNNER_TEMP/build.keychain"
          pass="$(uuidgen)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: 빌드
        run: ./mac/build.sh --zip

      - name: dmg
        run: ./mac/dmg.sh

      - name: 공증
        if: env.DDONG_SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          # dmg 에 티켓을 박아 둔다. 받는 사람이 오프라인이어도 바로 열린다.
          ./mac/notarize.sh
          # 자동 업데이트가 받아 가는 zip 은 공증된 앱으로 다시 싼다.
          rm -f dist/ddong-dodge-mac.zip
          (cd dist/mac && ditto -c -k --keepParent "몰겜.app" ../ddong-dodge-mac.zip)

      - name: 자산 이름을 아스키로
        run: |
          mkdir -p out
          cp "dist/ddong-dodge-mac.zip" "out/ddong-dodge-mac.zip"
          cp dist/*.dmg "out/ddong-dodge.dmg"
          ls -lh out

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 노트는 파일로 넘긴다. 여기 인라인으로 쓰면 YAML 들여쓰기가 그대로 남아
          # 깃허브가 코드 블록으로 렌더한다.
          cat > notes.md <<'EOF'
          처음 깔 때는 **ddong-dodge.dmg** 를 받아 Applications 로 끌어 넣는다.

          아직 공증(notarize)을 안 한 앱이라 처음 열 때 「Apple이 악성 코드가 없음을 확인할 수
          없습니다」가 뜬다. macOS 15 부터는 우클릭 → 열기 우회가 없어졌으니 이렇게 지나간다:

          1. 그 창에서 **완료** 를 누른다 (휴지통으로 이동 아님)
          2. **시스템 설정 → 개인정보 보호 및 보안** 을 열고 아래로 내린다
          3. 「'몰겜'이(가) 차단되었습니다」 옆의 **그래도 열기** 를 누른다

          터미널이 편하면 이 한 줄이면 끝난다:

          ```
          xattr -dr com.apple.quarantine /Applications/몰겜.app
          ```

          USB 나 사내 공유 폴더로 받은 경우에는 이 경고 자체가 안 뜬다.

          이미 깔려 있으면 앱이 알아서 이 버전을 찾아낸다 — 메뉴 막대 💩 에 `새 버전 받기` 가 뜬다.
          `ddong-dodge-mac.zip` 은 앱이 자동 업데이트에 쓰는 파일이라 사람이 받을 필요는 없다.
          EOF
          sed -i '' 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            out/ddong-dodge.dmg out/ddong-dodge-mac.zip
