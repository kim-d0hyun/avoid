# 태그를 밀면 맥에서 빌드해 릴리스에 붙인다. 사람 손이 닿는 곳은 태그 하나뿐이다.
#
#   npm version patch && git push --follow-tags
#
# 앱은 여기 붙는 *-mac.zip 을 보고 스스로 갈아 끼운다 (mac/Sources/update.swift).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 버전이 태그와 같은지 본다
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" mac/Info.plist)
          echo "태그 $tag · Info.plist $plist"
          # 이게 어긋나면 앱이 자기가 최신인 줄 알고 업데이트를 영영 안 받는다.
          [ "$tag" = "$plist" ] || { echo "::error::태그와 Info.plist 버전이 다르다"; exit 1; }

      - name: 빌드
        run: ./mac/build.sh --zip

      - name: dmg
        run: ./mac/dmg.sh

      - name: 자산 이름을 아스키로
        run: |
          mkdir -p out
          cp "dist/ddong-dodge-mac.zip" "out/ddong-dodge-mac.zip"
          cp dist/*.dmg "out/ddong-dodge.dmg"
          ls -lh out

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 노트는 파일로 넘긴다. 여기 인라인으로 쓰면 YAML 들여쓰기가 그대로 남아
          # 깃허브가 코드 블록으로 렌더한다.
          cat > notes.md <<'EOF'
          처음 깔 때는 **ddong-dodge.dmg** 를 받아 Applications 로 끌어 넣는다.

          서명·공증을 안 한 앱이라 처음 한 번은 **우클릭 → 열기 → 열기** 로 지나가야 한다.

          이미 깔려 있으면 앱이 알아서 이 버전을 찾아낸다 — 메뉴 막대 💩 에 `새 버전 받기` 가 뜬다.
          `ddong-dodge-mac.zip` 은 앱이 자동 업데이트에 쓰는 파일이라 사람이 받을 필요는 없다.
          EOF
          sed -i '' 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            out/ddong-dodge.dmg out/ddong-dodge-mac.zip
